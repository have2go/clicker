<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diamondGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#e0e0ff;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#b0b0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="diamondShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Main diamond shape -->
  <path d="M 100 30 L 140 80 L 100 170 L 60 80 Z" fill="url(#diamondGradient)" stroke="#ffffff" stroke-width="2" opacity="0.95"/>
  
  <!-- Top facet -->
  <path d="M 100 30 L 140 80 L 100 80 Z" fill="url(#diamondShine)" opacity="0.6"/>
  
  <!-- Left facet -->
  <path d="M 100 30 L 60 80 L 100 80 Z" fill="url(#diamondShine)" opacity="0.4"/>
  
  <!-- Right side facet -->
  <path d="M 140 80 L 100 170 L 100 80 Z" fill="url(#diamondShine)" opacity="0.3"/>
  
  <!-- Left side facet -->
  <path d="M 60 80 L 100 170 L 100 80 Z" fill="url(#diamondShine)" opacity="0.2"/>
  
  <!-- Highlight sparkles -->
  <circle cx="120" cy="60" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="80" cy="60" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="100" cy="100" r="2" fill="#ffffff" opacity="0.7"/>
</svg>

